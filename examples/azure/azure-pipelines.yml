trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - src/*

pr:
  branches:
    include:
      - main

schedules:
  - cron: "0 3 * * *"
    displayName: Nightly
    branches:
      include:
        - main

parameters:
  - name: deployEnv
    type: string
    default: staging
    values:
      - staging
      - production

variables:
  buildConfiguration: Release

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: compile
        displayName: Compile
        steps:
          - checkout: self
            fetchDepth: 0
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - task: Cache@2
            inputs:
              key: python | "$(Agent.OS)" | requirements.txt
              path: .cache/pip
          - script: pip install -r requirements.txt
            displayName: Install
          - script: |
              echo "building $(Build.SourceVersion) on $(Build.SourceBranchName)"
              echo "head is $(git rev-parse HEAD)"
            displayName: Build info
          - publish: dist
            artifact: drop

  - stage: Test
    dependsOn: Build
    jobs:
      - job: unit
        strategy:
          matrix:
            Python311:
              python.version: "3.11"
            Python312:
              python.version: "3.12"
          maxParallel: 2
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(python.version)
          - bash: pytest -q
            displayName: Run tests
      - job: lint
        continueOnError: true
        steps:
          - script: ruff check .

  - stage: Deploy
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: ship
        timeoutInMinutes: 30
        steps:
          - download: current
            artifact: drop
          - script: ./deploy.sh
            env:
              APP_ENV: production
