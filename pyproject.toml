[project]
name = "portover"
version = "0.2.0"
description = "Migrate one config dialect to another, one directive at a time: pip->uv, Jenkins->GitHub Actions, Travis->GitHub Actions, flake8->ruff"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sophie Nguyen", email = "sophie.nguyenthuthuy@gmail.com" }]
keywords = ["migration", "uv", "requirements.txt", "jenkins", "github-actions", "flake8", "ruff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
portover = "portover.cli:main"

[project.urls]
Repository = "https://github.com/sophie-nguyenthuthuy/portover"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portover"]
